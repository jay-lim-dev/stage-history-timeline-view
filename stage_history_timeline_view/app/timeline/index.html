<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Stage History — Diagnostic</title>
  </head>
  <body>
    <p style="font-family:monospace;padding:12px">Open the browser console to see the raw API responses.</p>

    <script src="https://live.zwidgets.com/js-sdk/1.0/ZohoEmbededAppSDK.min.js"></script>
    <script src="app.js"></script>
    <script>
      ZOHO.embeddedApp.on("PageLoad", function (context) {
        console.log("=== PageLoad context ===");
        console.log(context);

        var recordId = context.EntityId;

        var historyPromise = ZOHO.CRM.API.getRelatedRecords({
          Entity: "Deals",
          RecordID: recordId,
          RelatedList: "Stage_History",
          page: 1,
          per_page: 200
        });

        var cachePromise = StageCache.init();

        Promise.all([cachePromise, historyPromise])
          .then(function (results) {
            var map      = results[0];
            var response = results[1];
            var records  = (response && response.data) || [];

            console.log("=== StageCache map ===");
            console.table(Object.keys(map).map(function (id) {
              return { id: id, stage: map[id] };
            }));

            var stageIds = records.map(function (r) { return r.Stage; });

            return StageCache.getStageNames(stageIds).then(function (names) {
              console.log("=== getStageNames() result ===");
              stageIds.forEach(function (id, i) {
                console.log(id, "→", names[i]);
              });
            });
          })
          .catch(function (err) {
            console.error("=== Verification failed ===", err);
          });

        console.log("=== buildTimelineData ===");
        buildTimelineData(recordId, { showProbabilityBar: false })
          .then(function (result) {
            console.log("stages:", result.stages.length);
            result.stages.forEach(function (s, i) {
              console.log(
                i === 0 ? "[CURRENT]" : "[PAST   ]",
                s.name,
                "| entered:", s.enteredAt.toLocaleString(),
                "| " + (s.isCurrent ? "elapsed: " + formatDuration(s.elapsedMs) : "duration: " + formatDuration(s.durationMs)),
                "| by:", s.modifiedBy,
                "| prob:", s.probability + "%"
              );
            });
          })
          .catch(function (err) {
            console.error("=== buildTimelineData failed ===", err);
          });
      });

      ZOHO.embeddedApp.init();
    </script>
  </body>
</html>
