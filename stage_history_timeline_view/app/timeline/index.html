<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stage History</title>
    <link rel="stylesheet" href="css/timeline.css" />
  </head>
  <body>

    <div id="app"></div>

    <script src="https://live.zwidgets.com/js-sdk/1.0/ZohoEmbededAppSDK.min.js"></script>
    <script src="app.js"></script>
    <script>
      ZOHO.embeddedApp.on("PageLoad", function (context) {
        var app = document.getElementById("app");
        var recordId = context.EntityId;

        app.innerHTML =
          '<div style="padding:32px;text-align:center;font-family:Inter,sans-serif;color:#9CA3AF;font-size:13px">' +
          'Loading stage history…</div>';

        Promise.all([loadSettings(), buildTimelineData(recordId)])
          .then(function (results) {
            var settings = results[0];
            var data     = results[1];

            if (data.stages.length === 0) {
              app.innerHTML =
                '<div style="padding:32px;text-align:center;font-family:Inter,sans-serif;color:#9CA3AF;font-size:13px">' +
                'No stage history found for this deal.</div>';
              return;
            }

            renderTimeline(app, data.stages, settings);

            if (settings.showProbabilityBar && data.currentProbability !== null) {
              var probBar = app.querySelector("#sht-prob-bar");
              if (probBar) {
                renderProbabilityBar(probBar, data.currentProbability, data.stages[0].name);
              }
            }
          })
          .catch(function (err) {
            console.error("[Timeline] Failed to load stage history:", err);
            app.innerHTML =
              '<div style="padding:20px;font-family:Inter,sans-serif">' +
                '<div style="border:1px solid #FEE2E2;background:#FFF5F5;border-radius:8px;padding:16px;display:flex;align-items:flex-start;gap:12px">' +
                  '<span style="font-size:18px;line-height:1">⚠️</span>' +
                  '<div>' +
                    '<div style="font-size:13px;font-weight:600;color:#991B1B;margin-bottom:4px">Could not load stage history</div>' +
                    '<div style="font-size:12px;color:#B91C1C;margin-bottom:12px">' + (err && err.message ? err.message : 'An unexpected error occurred.') + '</div>' +
                    '<button id="retry-btn" style="font-size:12px;font-weight:500;color:#1D4ED8;background:none;border:none;cursor:pointer;padding:0;text-decoration:underline">Retry</button>' +
                  '</div>' +
                '</div>' +
              '</div>';
            document.getElementById("retry-btn").addEventListener("click", function () {
              location.reload();
            });
          });
      });

      ZOHO.embeddedApp.init();
    </script>

  </body>
</html>
